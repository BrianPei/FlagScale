name: Common Functional Tests - Inference

# Inference task workflow - currently minimal tests
# Install scripts and test infrastructure are ready

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform name (e.g., cuda, default)
      test_matrix:
        required: true
        type: string
        description: JSON array of test configurations
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      pkg_mgr:
        required: false
        type: string
        description: Package manager (pip, uv, conda). Default uv.
        default: "uv"
      env_name:
        required: false
        type: string
        description: Conda environment name (for conda only)
        default: ""
      env_path:
        required: false
        type: string
        description: Environment path (venv path for uv, conda installation path for conda)
        default: "/opt/venv"
      timeout_minutes:
        required: false
        type: number
        description: Maximum duration for one inference functional test
        default: 15

jobs:
  functional_test_inference:
    defaults:
      run:
        shell: bash
    env:
      PROJECT_ROOT: ${{ github.workspace }}/FlagScale
    runs-on: ${{ fromJson(inputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        test_config: ${{ fromJson(inputs.test_matrix) }}
    container:
      image: ${{ inputs.image }}
      ports:
        - 80
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}

    steps:
      - name: Checkout code (attempt 1)
        id: checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: FlagScale
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout code (attempt 2)
        if: steps.checkout_attempt_1.outcome == 'failure'
        id: checkout_attempt_2
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: FlagScale
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout code (attempt 3)
        if: steps.checkout_attempt_2.outcome == 'failure'
        id: checkout_attempt_3
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: FlagScale
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Set safe directory
        run: |
          git config --global --add safe.directory $PROJECT_ROOT

      - name: Check environment info
        run: cd $PROJECT_ROOT && bash ./tests/test_utils/runners/check_env.sh

      - name: Install current FlagScale CLI
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          PKG_MGR='${{ inputs.pkg_mgr }}'
          ENV_NAME='${{ inputs.env_name }}'
          ENV_PATH='${{ inputs.env_path }}'

          source ./tools/install/utils/pyenv_utils.sh
          case "$PKG_MGR" in
            conda)
              if [ -n "$ENV_NAME" ] && [ -n "$ENV_PATH" ]; then
                activate_conda "$ENV_NAME" "$ENV_PATH"
              fi
              ;;
            uv)
              if [ -n "$ENV_PATH" ] && [ -d "$ENV_PATH" ]; then
                activate_uv_env "$ENV_PATH"
              fi
              ;;
            pip)
              ;;
            *)
              echo "Unsupported package manager: $PKG_MGR" >&2
              exit 1
              ;;
          esac

          # Always install the checked-out revision so the functional test does
          # not accidentally exercise a stale FlagScale package from the image.
          python -m pip install . --no-build-isolation --root-user-action=ignore
          python -m pip install pytest --root-user-action=ignore
          command -v flagscale
          flagscale --version

      - name: Run functional tests
        id: functional_test
        run: |
          set -euo pipefail
          cd $PROJECT_ROOT

          PLATFORM='${{ inputs.platform }}'
          DEVICE='${{ matrix.test_config.device }}'
          TASK='${{ matrix.test_config.task }}'
          MODEL='${{ matrix.test_config.model }}'
          CASE='${{ matrix.test_config.case }}'
          PKG_MGR='${{ inputs.pkg_mgr }}'
          ENV_NAME='${{ inputs.env_name }}'
          ENV_PATH='${{ inputs.env_path }}'

          echo "Running functional tests for inference"
          echo "Platform: $PLATFORM"
          echo "Device: $DEVICE"
          echo "Task: $TASK"
          echo "Model: $MODEL"
          echo "Case: ${CASE:-all}"
          echo "Package Manager: $PKG_MGR"
          echo "Environment Name: $ENV_NAME"
          echo "Environment Path: $ENV_PATH"
          echo "Project root: $PROJECT_ROOT"

          # Source environment utilities
          source ./tools/install/utils/pyenv_utils.sh

          # Activate environment based on package manager
          case "$PKG_MGR" in
            conda)
              if [ -n "$ENV_NAME" ]; then
                activate_conda "$ENV_NAME" "$ENV_PATH" || echo "⚠️  Conda activation failed"
              fi
              ;;
            uv)
              if [ -n "$ENV_PATH" ] && [ -d "$ENV_PATH" ]; then
                activate_uv_env "$ENV_PATH" || echo "⚠️  UV activation failed"
              fi
              ;;
            pip)
              echo "ℹ️  Running tests with pip/system Python"
              PLATFORM_ENV_SCRIPT="./tools/install/$PLATFORM/env.sh"
              if [ -f "$PLATFORM_ENV_SCRIPT" ]; then
                source "$PLATFORM_ENV_SCRIPT"
              fi
              ;;
          esac

          # Display Python environment info
          echo "Python location: $(which python)"
          echo "Python version: $(python --version)"

          if [ "$PLATFORM" = "kunlunxin" ]; then
            echo "Kunlunxin vLLM platform probe:"
            python -c 'import importlib.metadata as metadata; print("vllm:", metadata.version("vllm")); print("vllm-plugin-fl:", metadata.version("vllm-plugin-fl") if "vllm-plugin-fl" in {dist.metadata["Name"].lower() for dist in metadata.distributions()} else "not-installed"); print("platform_plugins:", {entry.name: entry.value for entry in metadata.entry_points(group="vllm.platform_plugins")})' || true
            # Decisive probe: the real serve crashes at
            # flag_gems/fused/geglu.py:12 (pow = tl_extra_shim.pow) because
            # tl_extra_shim falls back to triton.language.math (no pow on
            # Triton 3.0.0) when the kunlunxin tl_extra module
            # (triton.language.extra.xpu.libdevice) fails to import. The
            # case-yaml sets GEMS_VENDOR=kunlunxin for the real serve, so
            # mirror that here and print triton version + xpu.libdevice
            # importability + flag_gems import result, so the root cause is
            # in the log instead of guessed. Non-fatal (|| true).
            # Probe runs in the functional-test container, which under
            # all_tasks is the ALL image (Dockerfile.all = install_inference +
            # install_serve + install_train). install_train.sh is the only step
            # the inference-only image (Dockerfile.inference = install_inference
            # + install_serve) does NOT run, and its retry_pip_install
            # train.txt (no --no-deps) pulls peft -> accelerate -> torch; the
            # vendor torch (torch_xmlir, 2.9.0+cu129) is a non-standard wheel,
            # so pip may reinstall stock PyPI torch, whose own dep is stock
            # triton -- overwriting the image's kunlunxin triton 3.0.0 and its
            # triton.language.extra.xpu.libdevice. Print torch/triton/flag_gems
            # versions + locations so one run tells us exactly what train
            # clobbered. Non-fatal (|| true).
            GEMS_VENDOR=kunlunxin VLLM_PLUGINS=fl VLLM_FL_PLATFORM=kunlunxin python -c '
import os
print("GEMS_VENDOR in proc:", os.environ.get("GEMS_VENDOR"))
try:
    import torch
    print("torch version:", torch.__version__, "file:", torch.__file__)
except Exception as _e:
    print("torch import: FAIL:", repr(_e))
try:
    import triton
    print("triton version:", getattr(triton, "__version__", "?"), "file:", getattr(triton, "__file__", "?"))
except Exception as _e:
    print("triton import: FAIL:", repr(_e))
try:
    import triton.language.extra.xpu.libdevice as _x
    print("triton.language.extra.xpu.libdevice: OK")
except Exception as _e:
    print("triton.language.extra.xpu.libdevice: FAIL:", repr(_e))
try:
    import flag_gems
    print("flag_gems version:", getattr(flag_gems, "__version__", "?"), "file:", flag_gems.__file__)
    from flag_gems.utils import tl_extra_shim as _s
    print("tl_extra_shim:", getattr(_s, "__name__", _s), "has_pow:", hasattr(_s, "pow"))
except Exception as _e:
    print("flag_gems import: FAIL:", repr(_e))
' || true
          fi

          # Run functional tests using run_tests.sh
          bash "$PROJECT_ROOT/tests/test_utils/runners/run_tests.sh" \
            --platform "$PLATFORM" \
            --device "$DEVICE" \
            --type functional \
            --task "$TASK" \
            --model "$MODEL" \
            --list "$CASE"
          exit_code=$?

          if [ $exit_code -eq 0 ]; then
            echo "✅ Functional tests passed for $PLATFORM/$DEVICE/$TASK/$MODEL/$CASE"
          else
            echo "❌ Functional tests failed for $PLATFORM/$DEVICE/$TASK/$MODEL/$CASE (exit code: $exit_code)"
          fi

          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code
        timeout-minutes: ${{ inputs.timeout_minutes }}

      - name: Upload Functional Test Logs
        if: always() && steps.functional_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: functional_tests-logs-${{ inputs.platform }}-${{ github.run_id }}-${{ matrix.test_config.task }}-${{ matrix.test_config.model }}
          path: ${{ env.PROJECT_ROOT }}/tests/functional_tests/${{ matrix.test_config.task }}/${{ matrix.test_config.model }}/test_results
          retention-days: 7
          if-no-files-found: warn
