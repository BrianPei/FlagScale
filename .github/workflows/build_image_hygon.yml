name: Build Docker Images - Hygon

on:
  workflow_dispatch:
    inputs:
      target:
        description: Docker target stage
        required: true
        type: choice
        options: [dev, release]
        default: dev
      push:
        description: Push image to the configured registry
        type: boolean
        default: true
      no_cache:
        description: Build without Docker cache
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'docker/hygon/**'
      - 'tools/install/hygon/**'
      - 'requirements/hygon/**'
      - '.github/configs/hygon.yml'
      - '.github/workflows/build_image_hygon.yml'
      - '.github/workflows/build_image_common.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build_image_common.yml
    with:
      platform: hygon
      task: train
      target: ${{ inputs.target || 'dev' }}
      push: ${{ github.event_name == 'pull_request' || inputs.push }}
      no_cache: ${{ inputs.no_cache || false }}
