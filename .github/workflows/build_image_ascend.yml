name: Build Docker Images - Ascend

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/ascend/**'
      - 'tools/install/ascend/**'
      - 'tools/install/utils/**'
      - 'tools/install/install.sh'
      - 'requirements/ascend/**'
      - 'flagscale/train/megatron/plugin_flagscale/**'
      - 'flagscale/train/megatron/training/config/common_config.py'
      - 'tests/functional_tests/train/qwen3/**'
      - '.github/configs/ascend.yml'
      - '.github/workflows/functional_tests_inference.yml'
      - '.github/workflows/functional_tests_serve.yml'
      - 'tests/test_utils/config/platforms/ascend.yaml'
      - 'tests/test_utils/runners/check_results.py'
      - 'tests/test_utils/runners/setup_training_test_env.sh'
      - '.github/workflows/build_image_ascend.yml'
  push:
    branches: [main]
    paths:
      - 'docker/ascend/**'
      - 'tools/install/ascend/**'
      - 'tools/install/utils/**'
      - 'tools/install/install.sh'
      - 'requirements/ascend/**'
      - 'flagscale/train/megatron/plugin_flagscale/**'
      - 'flagscale/train/megatron/training/config/common_config.py'
      - 'tests/functional_tests/train/qwen3/**'
      - '.github/configs/ascend.yml'
      - '.github/workflows/functional_tests_inference.yml'
      - '.github/workflows/functional_tests_serve.yml'
      - 'tests/test_utils/config/platforms/ascend.yaml'
      - 'tests/test_utils/runners/check_results.py'
      - 'tests/test_utils/runners/setup_training_test_env.sh'
      - '.github/workflows/build_image_ascend.yml'
  workflow_dispatch:
    inputs:
      task:
        description: Image task to build
        required: true
        type: choice
        options: [train, inference, all]
        default: all
      target:
        description: Docker build target
        required: true
        type: choice
        options: [dev, release]
        default: dev
      build_all_tasks:
        description: Build train, inference and all-in-one images
        type: boolean
        default: true
      push:
        description: Push candidate images to Harbor for validation
        type: boolean
        default: true
      no_cache:
        description: Build without Docker cache
        type: boolean
        default: false
      validation_only:
        description: Reuse existing images and run only focused validation
        type: boolean
        default: false
      validation_suite:
        description: Focused validation suite
        type: choice
        options: [failed, inference, serve, all_cli]
        default: failed
      task_image:
        description: Existing Ascend inference task image for focused validation
        type: string
        default: ""
      all_image:
        description: Existing Ascend all-in-one image for focused validation
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: harbor.baai.ac.cn
  REGISTRY_NAMESPACE: flagscale
  ASCEND_TRAIN_BASE_IMAGE: harbor.baai.ac.cn/flagos-dev/megatron-lm-fl:manual-20260717-ascend-dev
  ASCEND_INFERENCE_BASE_IMAGE: quay.io/ascend/vllm-ascend:v0.13.0rc1-a3
  ASCEND_TE_REPO: https://github.com/flagos-ai/TransformerEngine-FL.git
  ASCEND_TE_REF: 771a7488fc01c50f7714b8c6162f6bbfe451608a
  ASCEND_MEGATRON_REPO: https://github.com/flagos-ai/Megatron-LM-FL.git
  ASCEND_MEGATRON_REF: 175ae90ec92a9e6fea2d74ccd24d6a1835d3ae82
  TRAIN_PYTHON_VERSION: '3.12'
  INFERENCE_PYTHON_VERSION: '3.11'
  PKG_MGR: pip

jobs:
  prepare:
    name: Prepare trusted build parameters
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.params.outputs.matrix }}
      target: ${{ steps.params.outputs.target }}
      publish: ${{ steps.params.outputs.publish }}
      no_cache: ${{ steps.params.outputs.no_cache }}
      train_image: ${{ steps.params.outputs.train_image }}
      inference_image: ${{ steps.params.outputs.inference_image }}
      all_image: ${{ steps.params.outputs.all_image }}
      release_train_image: ${{ steps.params.outputs.release_train_image }}
      release_inference_image: ${{ steps.params.outputs.release_inference_image }}
      release_all_image: ${{ steps.params.outputs.release_all_image }}
      run_tests: ${{ steps.params.outputs.run_tests }}
    steps:
      - name: Compute parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"
          TARGET="${{ inputs.target || 'dev' }}"
          PUBLISH=false
          RUN_TESTS=false

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Untrusted PR code never receives Harbor credentials and never pushes.
            MATRIX='{"task":["train","inference","all"]}'
            TARGET=dev
            NO_CACHE=false
          elif [ "${{ github.event_name }}" = "push" ]; then
            MATRIX='{"task":["train","inference","all"]}'
            PUBLISH=true
            RUN_TESTS=true
            NO_CACHE=false
          else
            if [ "${{ inputs.validation_only }}" = "true" ]; then
              case "${{ inputs.validation_suite }}" in
                failed)
                  test -n "${{ inputs.task_image }}"
                  test -n "${{ inputs.all_image }}"
                  ;;
                inference|serve)
                  test -n "${{ inputs.task_image }}"
                  ;;
                all_cli)
                  test -n "${{ inputs.all_image }}"
                  ;;
              esac
              MATRIX='{"task":[]}'
              PUBLISH=false
              NO_CACHE=false
            else
              if [ "${{ inputs.build_all_tasks }}" = "true" ]; then
                MATRIX='{"task":["train","inference","all"]}'
              else
                MATRIX='{"task":["${{ inputs.task }}"]}'
              fi
              PUBLISH="${{ inputs.push }}"
              NO_CACHE="${{ inputs.no_cache }}"
              if [ "$PUBLISH" = "true" ] && [ "${{ inputs.build_all_tasks }}" = "true" ]; then
                RUN_TESTS=true
              fi
            fi
          fi

          TRAIN_TAG="${TARGET}-ascend-py${{ env.TRAIN_PYTHON_VERSION }}-${SHORT_SHA}"
          INFERENCE_TAG="${TARGET}-ascend-py${{ env.INFERENCE_PYTHON_VERSION }}-${SHORT_SHA}"
          ALL_TAG="${TARGET}-ascend-py${{ env.TRAIN_PYTHON_VERSION }}-py${{ env.INFERENCE_PYTHON_VERSION }}-${SHORT_SHA}"
          CANDIDATE_TRAIN_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-train:candidate-${TRAIN_TAG}"
          CANDIDATE_INFERENCE_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-inference:candidate-${INFERENCE_TAG}"
          CANDIDATE_ALL_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-all:candidate-${ALL_TAG}"
          RELEASE_TRAIN_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-train:${TRAIN_TAG}"
          RELEASE_INFERENCE_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-inference:${INFERENCE_TAG}"
          RELEASE_ALL_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-all:${ALL_TAG}"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "run_tests=$RUN_TESTS" >> "$GITHUB_OUTPUT"
          echo "no_cache=$NO_CACHE" >> "$GITHUB_OUTPUT"
          echo "train_image=$CANDIDATE_TRAIN_IMAGE" >> "$GITHUB_OUTPUT"
          echo "inference_image=$CANDIDATE_INFERENCE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "all_image=$CANDIDATE_ALL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release_train_image=$RELEASE_TRAIN_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release_inference_image=$RELEASE_INFERENCE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release_all_image=$RELEASE_ALL_IMAGE" >> "$GITHUB_OUTPUT"

  validate_pr:
    name: Validate untrusted Ascend PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Dockerfiles, shell and test configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f docker/ascend/Dockerfile.train
          test -f docker/ascend/Dockerfile.inference
          test -f docker/ascend/Dockerfile.all
          test -f requirements/ascend/inference.txt
          bash -n tools/install/ascend/activate_runtime.sh
          bash -n tools/install/ascend/install_train.sh
          bash -n tools/install/ascend/install_inference.sh
          bash -n tools/install/ascend/install_serve.sh
          bash -n tools/install/utils/retry_utils.sh
          bash -n tests/test_utils/runners/setup_training_test_env.sh
          python -m py_compile \
            tests/test_utils/runners/check_results.py \
            flagscale/train/megatron/plugin_flagscale/npu_plugin.py \
            flagscale/train/megatron/training/config/common_config.py
          python tests/test_utils/runners/parse_config.py \
            --platform ascend --device ascend910 \
            --type functional --task train | \
            grep -q '0_6b_ascend_smoke'

  build:
    name: Build Ascend ${{ matrix.task }}
    needs: prepare
    # A full Ascend base image build is intentionally limited to trusted
    # events. Pull requests run validate_pr above without secrets or access to
    # the private accelerator runner.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.validation_only != true)
    runs-on: flagscale-ascend-ascend910-gpu2-32c-128g
    env:
      BUILDKIT_PROGRESS: plain
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* 2>/dev/null || true

      - name: Configure Git proxy
        shell: bash
        run: |
          git_proxy="${FOREIGN_PROXY:-${FOREIGN_HTTPS_PROXY:-${https_proxy:-${HTTPS_PROXY:-}}}}"
          if [ -n "$git_proxy" ]; then
            echo "::add-mask::$git_proxy"
            git config --global http.proxy "$git_proxy"
            git config --global https.proxy "$git_proxy"
          fi

      - name: Checkout source (attempt 1)
        id: checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Checkout source (attempt 2)
        id: checkout_attempt_2
        if: steps.checkout_attempt_1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Checkout source (attempt 3)
        if: steps.checkout_attempt_2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect runner proxy
        id: proxy
        shell: bash
        run: |
          runner_http_proxy="${http_proxy:-${HTTP_PROXY:-}}"
          runner_https_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
          foreign_http_proxy="${FOREIGN_HTTP_PROXY:-${FOREIGN_PROXY:-$runner_http_proxy}}"
          foreign_https_proxy="${FOREIGN_HTTPS_PROXY:-${FOREIGN_PROXY:-$runner_https_proxy}}"
          buildkit_proxy="${HARBOR_PROXY:-$runner_http_proxy}"
          echo "::add-mask::$buildkit_proxy"
          echo "::add-mask::$foreign_http_proxy"
          echo "::add-mask::$foreign_https_proxy"
          echo "http_proxy=$foreign_http_proxy" >> "$GITHUB_OUTPUT"
          echo "https_proxy=$foreign_https_proxy" >> "$GITHUB_OUTPUT"
          echo "buildkit_proxy=$buildkit_proxy" >> "$GITHUB_OUTPUT"
          echo "no_proxy=${no_proxy:-${NO_PROXY:-}}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.http_proxy=${{ steps.proxy.outputs.buildkit_proxy }}
            env.https_proxy=${{ steps.proxy.outputs.buildkit_proxy }}
            env.no_proxy=${{ steps.proxy.outputs.no_proxy }}
            env.HTTP_PROXY=${{ steps.proxy.outputs.buildkit_proxy }}
            env.HTTPS_PROXY=${{ steps.proxy.outputs.buildkit_proxy }}
            env.NO_PROXY=${{ steps.proxy.outputs.no_proxy }}

      - name: Log in to Harbor for trusted publishing
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Select task image and base
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            train)
              echo "base=${{ env.ASCEND_TRAIN_BASE_IMAGE }}" >> "$GITHUB_OUTPUT"
              echo "tag=${{ needs.prepare.outputs.train_image }}" >> "$GITHUB_OUTPUT"
              ;;
            inference)
              echo "base=${{ env.ASCEND_INFERENCE_BASE_IMAGE }}" >> "$GITHUB_OUTPUT"
              echo "tag=${{ needs.prepare.outputs.inference_image }}" >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo "tag=${{ needs.prepare.outputs.all_image }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and optionally push (attempt 1)
        id: build_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ascend/Dockerfile.${{ matrix.task }}
          target: ${{ needs.prepare.outputs.target }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.tag }}
          no-cache: ${{ needs.prepare.outputs.no_cache == 'true' }}
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.base }}
            TRAIN_BASE_IMAGE=${{ env.ASCEND_TRAIN_BASE_IMAGE }}
            INFERENCE_BASE_IMAGE=${{ env.ASCEND_INFERENCE_BASE_IMAGE }}
            PKG_MGR=${{ env.PKG_MGR }}
            FLAGSCALE_TE_REPO=${{ env.ASCEND_TE_REPO }}
            FLAGSCALE_TE_REF=${{ env.ASCEND_TE_REF }}
            FLAGSCALE_MEGATRON_REPO=${{ env.ASCEND_MEGATRON_REPO }}
            FLAGSCALE_MEGATRON_REF=${{ env.ASCEND_MEGATRON_REF }}
            HTTP_PROXY=${{ steps.proxy.outputs.http_proxy }}
            HTTPS_PROXY=${{ steps.proxy.outputs.https_proxy }}
            NO_PROXY=${{ steps.proxy.outputs.no_proxy }}
            http_proxy=${{ steps.proxy.outputs.http_proxy }}
            https_proxy=${{ steps.proxy.outputs.https_proxy }}
            no_proxy=${{ steps.proxy.outputs.no_proxy }}
          cache-from: type=gha,scope=ascend-${{ matrix.task }}
          cache-to: type=gha,mode=max,scope=ascend-${{ matrix.task }},ignore-error=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Wait before build retry
        if: steps.build_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Build and optionally push (attempt 2)
        id: build_attempt_2
        if: steps.build_attempt_1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ascend/Dockerfile.${{ matrix.task }}
          target: ${{ needs.prepare.outputs.target }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.tag }}
          no-cache: ${{ needs.prepare.outputs.no_cache == 'true' }}
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.base }}
            TRAIN_BASE_IMAGE=${{ env.ASCEND_TRAIN_BASE_IMAGE }}
            INFERENCE_BASE_IMAGE=${{ env.ASCEND_INFERENCE_BASE_IMAGE }}
            PKG_MGR=${{ env.PKG_MGR }}
            FLAGSCALE_TE_REPO=${{ env.ASCEND_TE_REPO }}
            FLAGSCALE_TE_REF=${{ env.ASCEND_TE_REF }}
            FLAGSCALE_MEGATRON_REPO=${{ env.ASCEND_MEGATRON_REPO }}
            FLAGSCALE_MEGATRON_REF=${{ env.ASCEND_MEGATRON_REF }}
            HTTP_PROXY=${{ steps.proxy.outputs.http_proxy }}
            HTTPS_PROXY=${{ steps.proxy.outputs.https_proxy }}
            NO_PROXY=${{ steps.proxy.outputs.no_proxy }}
            http_proxy=${{ steps.proxy.outputs.http_proxy }}
            https_proxy=${{ steps.proxy.outputs.https_proxy }}
            no_proxy=${{ steps.proxy.outputs.no_proxy }}
          cache-from: type=gha,scope=ascend-${{ matrix.task }}
          cache-to: type=gha,mode=max,scope=ascend-${{ matrix.task }},ignore-error=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Load candidate image into runner Docker
        if: >-
          always() &&
          needs.prepare.outputs.publish == 'true' &&
          (steps.build_attempt_1.outcome == 'success' ||
           steps.build_attempt_2.outcome == 'success')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ascend/Dockerfile.${{ matrix.task }}
          target: ${{ needs.prepare.outputs.target }}
          load: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.base }}
            TRAIN_BASE_IMAGE=${{ env.ASCEND_TRAIN_BASE_IMAGE }}
            INFERENCE_BASE_IMAGE=${{ env.ASCEND_INFERENCE_BASE_IMAGE }}
            PKG_MGR=${{ env.PKG_MGR }}
            FLAGSCALE_TE_REPO=${{ env.ASCEND_TE_REPO }}
            FLAGSCALE_TE_REF=${{ env.ASCEND_TE_REF }}
            FLAGSCALE_MEGATRON_REPO=${{ env.ASCEND_MEGATRON_REPO }}
            FLAGSCALE_MEGATRON_REF=${{ env.ASCEND_MEGATRON_REF }}
            HTTP_PROXY=${{ steps.proxy.outputs.http_proxy }}
            HTTPS_PROXY=${{ steps.proxy.outputs.https_proxy }}
            NO_PROXY=${{ steps.proxy.outputs.no_proxy }}
            http_proxy=${{ steps.proxy.outputs.http_proxy }}
            https_proxy=${{ steps.proxy.outputs.https_proxy }}
            no_proxy=${{ steps.proxy.outputs.no_proxy }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  ascend_tests:
    name: Test Ascend task images
    needs: [prepare, build]
    if: needs.prepare.outputs.run_tests == 'true'
    uses: ./.github/workflows/all_tests_common.yml
    secrets: inherit
    with:
      platform: ascend
      ci_train_image: ${{ needs.prepare.outputs.train_image }}
      ci_inference_image: ${{ needs.prepare.outputs.inference_image }}

  ascend_all_tests:
    name: Test Ascend all-in-one image
    needs: [prepare, build]
    if: needs.prepare.outputs.run_tests == 'true'
    uses: ./.github/workflows/all_tests_common.yml
    secrets: inherit
    with:
      platform: ascend
      ci_train_image: ${{ needs.prepare.outputs.all_image }}
      ci_inference_image: ${{ needs.prepare.outputs.all_image }}

  targeted_inference:
    name: Targeted Ascend inference
    needs: prepare
    if: >-
      inputs.validation_only == true &&
      (inputs.validation_suite == 'failed' || inputs.validation_suite == 'inference')
    uses: ./.github/workflows/functional_tests_inference.yml
    secrets: inherit
    with:
      platform: ascend
      test_matrix: '[{"device":"ascend910","task":"inference","model":"qwen3","case":"4b_tp2_ascend"}]'
      image: ${{ inputs.task_image }}
      runs_on: '["flagscale-ascend-ascend910-gpu2-32c-128g"]'
      container_volumes: '["/public-ks3/cicd/baai_datasets:/home/gitlab-runner/data","/public-ks3/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers","/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro","/usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons:ro","/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro"]'
      container_options: >-
        --device /dev/davinci_manager --device /dev/devmm_svm
        --device /dev/hisi_hdc --ipc=host --shm-size=500g
        --hostname flagscale_cicd --user root
        --ulimit nofile=65535:65535 --cap-add SYS_ADMIN
        --cap-add SYS_PTRACE --cap-add IPC_LOCK --cap-add NET_ADMIN
        --cap-add SYS_RAWIO --cap-add SYS_NICE
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined --privileged
      pkg_mgr: pip
      env_name: ""
      env_path: ""

  targeted_serve:
    name: Targeted Ascend serve
    needs: prepare
    if: >-
      inputs.validation_only == true &&
      (inputs.validation_suite == 'failed' || inputs.validation_suite == 'serve')
    uses: ./.github/workflows/functional_tests_serve.yml
    secrets: inherit
    with:
      platform: ascend
      test_matrix: '[{"device":"ascend910","task":"serve","model":"qwen3","case":"4b_tp2_ascend"}]'
      image: ${{ inputs.task_image }}
      runs_on: '["flagscale-ascend-ascend910-gpu2-32c-128g"]'
      container_volumes: '["/public-ks3/cicd/baai_datasets:/home/gitlab-runner/data","/public-ks3/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers","/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro","/usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons:ro","/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro"]'
      container_options: >-
        --device /dev/davinci_manager --device /dev/devmm_svm
        --device /dev/hisi_hdc --ipc=host --shm-size=500g
        --hostname flagscale_cicd --user root
        --ulimit nofile=65535:65535 --cap-add SYS_ADMIN
        --cap-add SYS_PTRACE --cap-add IPC_LOCK --cap-add NET_ADMIN
        --cap-add SYS_RAWIO --cap-add SYS_NICE
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined --privileged
      pkg_mgr: pip
      env_name: ""
      env_path: ""

  targeted_all_cli:
    name: Targeted Ascend all-in-one CLI
    needs: prepare
    if: >-
      inputs.validation_only == true &&
      (inputs.validation_suite == 'failed' || inputs.validation_suite == 'all_cli')
    uses: ./.github/workflows/functional_tests_cli.yml
    secrets: inherit
    with:
      platform: ascend
      image: ${{ inputs.all_image }}
      runs_on: '["flagscale-ascend-ascend910-gpu2-32c-128g"]'
      container_volumes: '["/public-ks3/cicd/baai_datasets:/home/gitlab-runner/data","/public-ks3/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers","/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro","/usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons:ro","/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro"]'
      container_options: >-
        --device /dev/davinci_manager --device /dev/devmm_svm
        --device /dev/hisi_hdc --ipc=host --shm-size=500g
        --hostname flagscale_cicd --user root
        --ulimit nofile=65535:65535 --cap-add SYS_ADMIN
        --cap-add SYS_PTRACE --cap-add IPC_LOCK --cap-add NET_ADMIN
        --cap-add SYS_RAWIO --cap-add SYS_NICE
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined --privileged
      pkg_mgr: pip
      env_name: ""
      env_path: /opt/flagscale/runtimes/train

  promote:
    name: Promote validated Ascend images
    needs: [prepare, build, ascend_tests, ascend_all_tests]
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      needs.prepare.outputs.run_tests == 'true' &&
      needs.ascend_tests.result == 'success' &&
      needs.ascend_all_tests.result == 'success'
    runs-on: flagscale-ascend-ascend910-gpu2-32c-128g
    steps:
      - name: Detect runner proxy
        id: proxy
        shell: bash
        run: |
          runner_http_proxy="${http_proxy:-${HTTP_PROXY:-}}"
          runner_https_proxy="${https_proxy:-${HTTPS_PROXY:-}}"
          buildkit_proxy="${HARBOR_PROXY:-$runner_http_proxy}"
          echo "::add-mask::$buildkit_proxy"
          echo "buildkit_proxy=$buildkit_proxy" >> "$GITHUB_OUTPUT"
          echo "no_proxy=${no_proxy:-${NO_PROXY:-}}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.http_proxy=${{ steps.proxy.outputs.buildkit_proxy }}
            env.https_proxy=${{ steps.proxy.outputs.buildkit_proxy }}
            env.no_proxy=${{ steps.proxy.outputs.no_proxy }}
            env.HTTP_PROXY=${{ steps.proxy.outputs.buildkit_proxy }}
            env.HTTPS_PROXY=${{ steps.proxy.outputs.buildkit_proxy }}
            env.NO_PROXY=${{ steps.proxy.outputs.no_proxy }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Promote candidate manifests
        shell: bash
        run: |
          set -euo pipefail

          promote() {
            local candidate=$1
            local release=$2
            docker buildx imagetools create --tag "$release" "$candidate"
            docker buildx imagetools inspect "$release"
          }

          promote \
            "${{ needs.prepare.outputs.train_image }}" \
            "${{ needs.prepare.outputs.release_train_image }}"
          promote \
            "${{ needs.prepare.outputs.inference_image }}" \
            "${{ needs.prepare.outputs.release_inference_image }}"
          promote \
            "${{ needs.prepare.outputs.all_image }}" \
            "${{ needs.prepare.outputs.release_all_image }}"

      - name: Publish release manifest
        shell: bash
        run: |
          {
            echo "### Validated Ascend images"
            echo ""
            echo "- Train: \`${{ needs.prepare.outputs.release_train_image }}\`"
            echo "- Inference: \`${{ needs.prepare.outputs.release_inference_image }}\`"
            echo "- All-in-one: \`${{ needs.prepare.outputs.release_all_image }}\`"
            echo "- FlagScale: \`${{ github.sha }}\`"
            echo "- TransformerEngine-FL: \`${{ env.ASCEND_TE_REF }}\`"
            echo "- Megatron-LM-FL: \`${{ env.ASCEND_MEGATRON_REF }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Ascend image pipeline summary
    needs:
      - prepare
      - validate_pr
      - build
      - ascend_tests
      - ascend_all_tests
      - targeted_inference
      - targeted_serve
      - targeted_all_cli
      - promote
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify pipeline
        shell: bash
        run: |
          set -euo pipefail
          echo "Build result: ${{ needs.build.result }}"
          echo "Task image test result: ${{ needs.ascend_tests.result }}"
          echo "All-in-one image test result: ${{ needs.ascend_all_tests.result }}"
          echo "Promotion result: ${{ needs.promote.result }}"
          echo "Candidate publishing enabled: ${{ needs.prepare.outputs.publish }}"

          if [ "${{ inputs.validation_only }}" = "true" ]; then
            failed=false
            for result in \
              "${{ needs.targeted_inference.result }}" \
              "${{ needs.targeted_serve.result }}" \
              "${{ needs.targeted_all_cli.result }}"; do
              if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                failed=true
              fi
            done
            [ "$failed" = "false" ]
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "${{ needs.validate_pr.result }}" = "success" ] || exit 1
            exit 0
          fi

          [ "${{ needs.build.result }}" = "success" ] || exit 1
          if [ "${{ needs.prepare.outputs.run_tests }}" = "true" ] && \
             [ "${{ needs.ascend_tests.result }}" != "success" ]; then
            exit 1
          fi
          if [ "${{ needs.prepare.outputs.run_tests }}" = "true" ] && \
             [ "${{ needs.ascend_all_tests.result }}" != "success" ]; then
            exit 1
          fi
          if [ "${{ needs.prepare.outputs.publish }}" = "true" ] && \
             [ "${{ needs.prepare.outputs.run_tests }}" = "true" ] && \
             [ "${{ needs.promote.result }}" != "success" ]; then
            exit 1
          fi
