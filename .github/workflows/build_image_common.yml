name: Common image build

on:
  workflow_call:
    inputs:
      platform:
        description: Platform directory below docker/
        required: true
        type: string
      runs_on:
        description: JSON array containing the runner labels
        required: true
        type: string
      matrix:
        description: JSON matrix with complete image-build entries
        required: true
        type: string
      max_parallel:
        description: Maximum image tasks to build concurrently
        required: false
        default: 1
        type: number
      push:
        required: false
        default: false
        type: boolean
      no_cache:
        required: false
        default: false
        type: boolean
    secrets:
      REGISTRY_USERNAME:
        required: false
      CONTAINER_REGISTRY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }} ${{ matrix.task }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* 2>/dev/null || true

      - name: Checkout source (attempt 1)
        id: checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout source (attempt 2)
        id: checkout_attempt_2
        if: steps.checkout_attempt_1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout source (attempt 3)
        if: steps.checkout_attempt_2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate image-build entry
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          BASE_IMAGE: ${{ matrix.base_image }}
          VALIDATION_SCRIPT: ${{ matrix.validation_script }}
        run: |
          set -euo pipefail
          test -f "$DOCKERFILE"
          test -n "$IMAGE"
          test -n "$BASE_IMAGE"
          if [ -n "$VALIDATION_SCRIPT" ]; then
            test -f "$VALIDATION_SCRIPT"
          fi

      - name: Detect runner proxy
        id: proxy
        shell: bash
        run: |
          echo "http_proxy=${http_proxy:-${HTTP_PROXY:-}}" >> "$GITHUB_OUTPUT"
          echo "https_proxy=${https_proxy:-${HTTPS_PROXY:-}}" >> "$GITHUB_OUTPUT"
          echo "no_proxy=${no_proxy:-${NO_PROXY:-}}" >> "$GITHUB_OUTPUT"

      - name: Resolve build arguments
        id: build_args
        shell: bash
        env:
          BUILD_ARGS_JSON: ${{ toJSON(matrix.build_args) }}
        run: |
          set -euo pipefail
          {
            echo 'args<<EOF_BUILD_ARGS'
            jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$BUILD_ARGS_JSON"
            echo 'EOF_BUILD_ARGS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry
        if: inputs.push || matrix.registry_login
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Run platform pre-build contract
        if: matrix.validation_script != ''
        shell: bash
        env:
          IMAGE_BUILD_PHASE: pre
          IMAGE_BUILD_TASK: ${{ matrix.task }}
          IMAGE_BUILD_BASE_IMAGE: ${{ matrix.base_image }}
          IMAGE_BUILD_CANDIDATE_IMAGE: ${{ matrix.image }}
          IMAGE_BUILD_RUNTIME_SMOKE_NPROC: ${{ matrix.runtime_smoke_nproc }}
          IMAGE_BUILD_VALIDATION_SCRIPT: ${{ matrix.validation_script }}
        run: bash "$IMAGE_BUILD_VALIDATION_SCRIPT"

      - name: Build image (attempt 1)
        id: build_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          network: ${{ matrix.network }}
          load: true
          tags: ${{ matrix.image }}
          no-cache: ${{ inputs.no_cache }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            ${{ steps.build_args.outputs.args }}
            HTTP_PROXY=${{ steps.proxy.outputs.http_proxy }}
            HTTPS_PROXY=${{ steps.proxy.outputs.https_proxy }}
            NO_PROXY=${{ steps.proxy.outputs.no_proxy }}
            http_proxy=${{ steps.proxy.outputs.http_proxy }}
            https_proxy=${{ steps.proxy.outputs.https_proxy }}
            no_proxy=${{ steps.proxy.outputs.no_proxy }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.base.name=${{ matrix.base_image }}

      - name: Wait before build retry
        if: steps.build_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Build image (attempt 2)
        if: steps.build_attempt_1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          network: ${{ matrix.network }}
          load: true
          tags: ${{ matrix.image }}
          no-cache: ${{ inputs.no_cache }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            ${{ steps.build_args.outputs.args }}
            HTTP_PROXY=${{ steps.proxy.outputs.http_proxy }}
            HTTPS_PROXY=${{ steps.proxy.outputs.https_proxy }}
            NO_PROXY=${{ steps.proxy.outputs.no_proxy }}
            http_proxy=${{ steps.proxy.outputs.http_proxy }}
            https_proxy=${{ steps.proxy.outputs.https_proxy }}
            no_proxy=${{ steps.proxy.outputs.no_proxy }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.base.name=${{ matrix.base_image }}

      - name: Run platform post-build contract
        if: matrix.validation_script != ''
        shell: bash
        env:
          IMAGE_BUILD_PHASE: post
          IMAGE_BUILD_TASK: ${{ matrix.task }}
          IMAGE_BUILD_BASE_IMAGE: ${{ matrix.base_image }}
          IMAGE_BUILD_CANDIDATE_IMAGE: ${{ matrix.image }}
          IMAGE_BUILD_RUNTIME_SMOKE_NPROC: ${{ matrix.runtime_smoke_nproc }}
          IMAGE_BUILD_VALIDATION_SCRIPT: ${{ matrix.validation_script }}
        run: bash "$IMAGE_BUILD_VALIDATION_SCRIPT"

      - name: Push image with retry
        if: inputs.push
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker push "$IMAGE"; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && break
            sleep $((attempt * 15))
          done
          echo "::error::Failed to push image after 3 attempts"
          exit 1

      - name: Record image result
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          TASK: ${{ matrix.task }}
          IMAGE: ${{ matrix.image }}
          BASE_IMAGE: ${{ matrix.base_image }}
        run: |
          set -euo pipefail
          digest="$(docker image inspect "$IMAGE" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' | head -n 1)"
          [ -n "$digest" ] || digest="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          {
            echo '### Image build result'
            echo
            echo "- Platform: \`$PLATFORM\`"
            echo "- Task: \`$TASK\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Base: \`$BASE_IMAGE\`"
            echo "- Digest/ID: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
