name: Build Docker Images - MThreads

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/musa/**'
      - 'tools/install/musa/**'
      - 'tools/install/utils/**'
      - 'tools/install/install.sh'
      - 'requirements/musa/**'
      - 'flagscale/platforms/**'
      - 'tests/test_utils/config/platforms/musa.yaml'
      - 'tests/test_utils/runners/parse_config.py'
      - 'tests/test_utils/runners/check_env.sh'
      - 'tests/test_utils/runners/check_results.py'
      - 'tests/test_utils/runners/run_functional_tests.sh'
      - 'tests/test_utils/runners/setup_training_test_env.sh'
      - 'tests/test_utils/runners/utils.sh'
      - 'tests/functional_tests/train/qwen3/conf/0_6b_musa_smoke.yaml'
      - 'tests/functional_tests/train/qwen3/conf/train/0_6b_musa_smoke.yaml'
      - 'tests/unit_tests/test_utilities.py'
      - 'tests/unit_tests/test_cli.py'
      - 'tests/unit_tests/runner/test_config_validation.py'
      - 'tests/unit_tests/test_spiky_loss_detector.py'
      - '.github/configs/musa.yml'
      - '.github/workflows/build_image_musa.yml'
  push:
    branches: [main]
    paths:
      - 'docker/musa/**'
      - 'tools/install/musa/**'
      - 'tools/install/utils/**'
      - 'tools/install/install.sh'
      - 'requirements/musa/**'
      - 'flagscale/platforms/**'
      - 'tests/test_utils/config/platforms/musa.yaml'
      - 'tests/test_utils/runners/parse_config.py'
      - 'tests/test_utils/runners/check_env.sh'
      - 'tests/test_utils/runners/check_results.py'
      - 'tests/test_utils/runners/run_functional_tests.sh'
      - 'tests/test_utils/runners/setup_training_test_env.sh'
      - 'tests/test_utils/runners/utils.sh'
      - 'tests/functional_tests/train/qwen3/conf/0_6b_musa_smoke.yaml'
      - 'tests/functional_tests/train/qwen3/conf/train/0_6b_musa_smoke.yaml'
      - 'tests/unit_tests/test_utilities.py'
      - 'tests/unit_tests/test_cli.py'
      - 'tests/unit_tests/runner/test_config_validation.py'
      - 'tests/unit_tests/test_spiky_loss_detector.py'
      - '.github/configs/musa.yml'
      - '.github/workflows/build_image_musa.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Docker build target
        required: true
        type: choice
        options: [dev, release]
        default: dev
      push:
        description: Push the candidate image to Harbor
        type: boolean
        default: true
      run_tests:
        description: Run CLI and unit tests after publishing
        type: boolean
        default: true
      no_cache:
        description: Build without Docker cache
        type: boolean
        default: false
      base_image:
        description: Optional trusted override for the pinned S5000 base image
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: harbor.baai.ac.cn
  REGISTRY_NAMESPACE: flagscale
  # PyTorch 2.7.1/MCCL is the newest base verified with the S5000 fleet's
  # 3.3.5-server driver. The vendor PyTorch 2.9.1 image passes tensor smoke but
  # fails communicator creation, so upgrading it must be coupled with drivers.
  MUSA_BASE_IMAGE: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:29ceebd-musa-ci@sha256:ef0c9a4d3df15c077ffcc589e66debbb8fd3a53248f384151d896e45a08894d0
  MUSA_MEGATRON_REPO: https://github.com/flagos-ai/Megatron-LM-FL.git
  MUSA_MEGATRON_REF: 175ae90ec92a9e6fea2d74ccd24d6a1835d3ae82
  PYTHON_VERSION: '3.10'
  PKG_MGR: pip
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_DEFAULT_TIMEOUT: '300'

jobs:
  prepare:
    name: Prepare trusted build parameters
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.params.outputs.target }}
      publish: ${{ steps.params.outputs.publish }}
      run_tests: ${{ steps.params.outputs.run_tests }}
      no_cache: ${{ steps.params.outputs.no_cache }}
      base_image: ${{ steps.params.outputs.base_image }}
      train_image: ${{ steps.params.outputs.train_image }}
      release_train_image: ${{ steps.params.outputs.release_train_image }}
    steps:
      - name: Compute parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ inputs.target || 'dev' }}"
          PUBLISH=false
          RUN_TESTS=false
          NO_CACHE=false
          BASE_IMAGE="${{ env.MUSA_BASE_IMAGE }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            PUBLISH=true
            RUN_TESTS=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PUBLISH="${{ inputs.push }}"
            RUN_TESTS="${{ inputs.run_tests }}"
            NO_CACHE="${{ inputs.no_cache }}"
            if [ -n "${{ inputs.base_image }}" ]; then
              BASE_IMAGE="${{ inputs.base_image }}"
            fi
            if [ "$RUN_TESTS" = "true" ] && [ "$PUBLISH" != "true" ]; then
              echo "::error::run_tests=true requires push=true so reusable jobs can pull the image"
              exit 1
            fi
          fi

          SHORT_SHA="${GITHUB_SHA::12}"
          TRAIN_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-train:candidate-${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"
          RELEASE_TRAIN_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-train:${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "run_tests=$RUN_TESTS" >> "$GITHUB_OUTPUT"
          echo "no_cache=$NO_CACHE" >> "$GITHUB_OUTPUT"
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "train_image=$TRAIN_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release_train_image=$RELEASE_TRAIN_IMAGE" >> "$GITHUB_OUTPUT"

  validate_pr:
    name: Validate untrusted MUSA PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (attempt 1)
        id: checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Checkout source (attempt 2)
        id: checkout_attempt_2
        if: steps.checkout_attempt_1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Checkout source (attempt 3)
        if: steps.checkout_attempt_2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate MUSA integration
        shell: bash
        run: |
          set -euo pipefail

          test -f docker/musa/Dockerfile.train
          test -f requirements/musa/base.txt
          test -f requirements/musa/train.txt
          test -f tests/test_utils/config/platforms/musa.yaml
          bash -n tools/install/musa/env.sh
          bash -n tools/install/musa/install_base.sh
          bash -n tools/install/musa/install_train.sh
          bash -n tools/install/utils/retry_utils.sh
          bash -n tests/test_utils/runners/check_env.sh
          bash -n tests/test_utils/runners/utils.sh
          python -m py_compile tests/test_utils/runners/parse_config.py
          python -m py_compile tests/unit_tests/test_utilities.py
          python tests/test_utils/runners/parse_config.py \
            --platform musa --type device_types | grep -q 's5000'
          python tests/test_utils/runners/parse_config.py \
            --platform s5000 --type unit | grep -q 'include'

  build:
    name: Build MUSA train
    needs: prepare
    if: github.event_name != 'pull_request'
    runs-on: flagscale-musa-s5000-gpu2-8c-256g
    outputs:
      train_image: ${{ needs.prepare.outputs.train_image }}
    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* 2>/dev/null || true

      - name: Checkout source (attempt 1)
        id: build_checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Checkout source (attempt 2)
        id: build_checkout_attempt_2
        if: steps.build_checkout_attempt_1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Checkout source (attempt 3)
        if: steps.build_checkout_attempt_2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect runner proxy
        id: proxy
        shell: bash
        run: |
          echo "http_proxy=${http_proxy:-${HTTP_PROXY:-}}" >> "$GITHUB_OUTPUT"
          echo "https_proxy=${https_proxy:-${HTTPS_PROXY:-}}" >> "$GITHUB_OUTPUT"
          echo "no_proxy=${no_proxy:-${NO_PROXY:-}}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Build MUSA train image (attempt 1)
        id: build_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/musa/Dockerfile.train
          target: ${{ needs.prepare.outputs.target }}
          load: true
          tags: ${{ needs.prepare.outputs.train_image }}
          no-cache: ${{ needs.prepare.outputs.no_cache == 'true' }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            PKG_MGR=${{ env.PKG_MGR }}
            PIP_INDEX_URL=${{ env.PIP_INDEX_URL }}
            PIP_DEFAULT_TIMEOUT=${{ env.PIP_DEFAULT_TIMEOUT }}
            FLAGSCALE_MEGATRON_REPO=${{ env.MUSA_MEGATRON_REPO }}
            FLAGSCALE_MEGATRON_REF=${{ env.MUSA_MEGATRON_REF }}
            HTTP_PROXY=${{ steps.proxy.outputs.http_proxy }}
            HTTPS_PROXY=${{ steps.proxy.outputs.https_proxy }}
            NO_PROXY=${{ steps.proxy.outputs.no_proxy }}
            http_proxy=${{ steps.proxy.outputs.http_proxy }}
            https_proxy=${{ steps.proxy.outputs.https_proxy }}
            no_proxy=${{ steps.proxy.outputs.no_proxy }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ needs.prepare.outputs.base_image }}

      - name: Wait before build retry
        if: steps.build_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Build MUSA train image (attempt 2)
        if: steps.build_attempt_1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/musa/Dockerfile.train
          target: ${{ needs.prepare.outputs.target }}
          load: true
          tags: ${{ needs.prepare.outputs.train_image }}
          no-cache: ${{ needs.prepare.outputs.no_cache == 'true' }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            PKG_MGR=${{ env.PKG_MGR }}
            PIP_INDEX_URL=${{ env.PIP_INDEX_URL }}
            PIP_DEFAULT_TIMEOUT=${{ env.PIP_DEFAULT_TIMEOUT }}
            FLAGSCALE_MEGATRON_REPO=${{ env.MUSA_MEGATRON_REPO }}
            FLAGSCALE_MEGATRON_REF=${{ env.MUSA_MEGATRON_REF }}
            HTTP_PROXY=${{ steps.proxy.outputs.http_proxy }}
            HTTPS_PROXY=${{ steps.proxy.outputs.https_proxy }}
            NO_PROXY=${{ steps.proxy.outputs.no_proxy }}
            http_proxy=${{ steps.proxy.outputs.http_proxy }}
            https_proxy=${{ steps.proxy.outputs.https_proxy }}
            no_proxy=${{ steps.proxy.outputs.no_proxy }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ needs.prepare.outputs.base_image }}

      - name: Push candidate image with retry
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if docker push "${{ needs.prepare.outputs.train_image }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Failed to push MUSA image after 3 attempts"
          exit 1

  musa_runtime:
    name: MUSA runtime and MCCL
    needs: [prepare, build]
    if: needs.prepare.outputs.run_tests == 'true' && needs.build.result == 'success'
    runs-on: flagscale-musa-s5000-gpu2-8c-256g
    steps:
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Validate MUSA and MCCL
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ needs.prepare.outputs.train_image }}"
          docker pull "$IMAGE"
          DEVICE_COUNT=$(docker run --rm --privileged --network=host \
            --env MTHREADS_VISIBLE_DEVICES=all \
            --env MTHREADS_DRIVER_CAPABILITIES=all "$IMAGE" \
            python -c 'import torch, torch_musa; print(torch.musa.device_count())')
          test "$DEVICE_COUNT" -ge 2

          docker run --rm --privileged --network=host \
            --env MTHREADS_VISIBLE_DEVICES=all \
            --env MTHREADS_DRIVER_CAPABILITIES=all "$IMAGE" python -c '
          import torch
          import torch_musa
          import megatron.core
          from megatron.plugin.platform import get_platform
          assert torch.musa.is_available()
          assert get_platform().device_name() == "musa"
          x = torch.arange(8, dtype=torch.float32, device="musa")
          assert (x * 2).cpu().tolist() == [0., 2., 4., 6., 8., 10., 12., 14.]
          '

          docker run --rm --privileged --network=host --ipc=host \
            --env MTHREADS_VISIBLE_DEVICES=all \
            --env MTHREADS_DRIVER_CAPABILITIES=all \
            --env EXPECTED_WORLD_SIZE="$DEVICE_COUNT" "$IMAGE" \
            torchrun --standalone --nproc_per_node="$DEVICE_COUNT" \
              --no-python python -c '
          import os
          import torch
          import torch_musa
          rank = int(os.environ["LOCAL_RANK"])
          world = int(os.environ["EXPECTED_WORLD_SIZE"])
          torch.musa.set_device(rank)
          torch.distributed.init_process_group(backend="mccl")
          value = torch.tensor([rank], dtype=torch.int64, device="musa")
          torch.distributed.all_reduce(value)
          assert value.item() == world * (world - 1) // 2
          torch.distributed.destroy_process_group()
          '

  musa_cli:
    name: MUSA CLI
    needs: [prepare, build]
    if: needs.prepare.outputs.run_tests == 'true' && needs.build.result == 'success'
    uses: ./.github/workflows/functional_tests_cli.yml
    with:
      platform: musa
      image: ${{ needs.prepare.outputs.train_image }}
      runs_on: '["flagscale-musa-s5000-gpu2-8c-256g"]'
      container_volumes: '["/mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data","/mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers"]'
      container_options: >-
        --hostname=flagscale-ci --privileged --network=host --ipc=host
        --shm-size=100g --ulimit memlock=-1
        --env MTHREADS_VISIBLE_DEVICES=all
        --env MTHREADS_DRIVER_CAPABILITIES=all
        --user root --ulimit nofile=65535:65535
      pkg_mgr: pip
      env_name: ''
      env_path: ''

  musa_unit:
    name: MUSA unit
    needs: [prepare, build]
    if: needs.prepare.outputs.run_tests == 'true' && needs.build.result == 'success'
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: musa
      device: s5000
      image: ${{ needs.prepare.outputs.train_image }}
      runs_on: '["flagscale-musa-s5000-gpu2-8c-256g"]'
      container_volumes: '["/mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data","/mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers"]'
      container_options: >-
        --hostname=flagscale-ci --privileged --network=host --ipc=host
        --shm-size=100g --ulimit memlock=-1
        --env MTHREADS_VISIBLE_DEVICES=all
        --env MTHREADS_DRIVER_CAPABILITIES=all
        --user root --ulimit nofile=65535:65535
      pkg_mgr: pip
      env_name: ''
      env_path: ''

  musa_train:
    name: MUSA functional train
    needs: [prepare, build]
    if: needs.prepare.outputs.run_tests == 'true' && needs.build.result == 'success'
    uses: ./.github/workflows/functional_tests_train.yml
    with:
      platform: musa
      test_matrix: '[{"device":"s5000","task":"train","model":"qwen3","case":"0_6b_musa_smoke"}]'
      image: ${{ needs.prepare.outputs.train_image }}
      runs_on: '["flagscale-musa-s5000-gpu2-8c-256g"]'
      container_volumes: '["/mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data","/mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers"]'
      container_options: >-
        --hostname=flagscale-ci --privileged --network=host --ipc=host
        --shm-size=100g --ulimit memlock=-1
        --env MTHREADS_VISIBLE_DEVICES=all
        --env MTHREADS_DRIVER_CAPABILITIES=all
        --user root --ulimit nofile=65535:65535
      pkg_mgr: pip
      env_name: ''
      env_path: ''

  promote:
    name: Promote validated MUSA image
    needs: [prepare, build, musa_runtime, musa_cli, musa_unit, musa_train]
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      needs.prepare.outputs.run_tests == 'true' &&
      needs.musa_runtime.result == 'success' &&
      needs.musa_cli.result == 'success' &&
      needs.musa_unit.result == 'success' &&
      needs.musa_train.result == 'success'
    runs-on: flagscale-musa-s5000-gpu2-8c-256g
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Promote candidate manifest
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${{ needs.prepare.outputs.release_train_image }}" \
            "${{ needs.prepare.outputs.train_image }}"
          docker buildx imagetools inspect \
            "${{ needs.prepare.outputs.release_train_image }}"

          {
            echo "### Validated MThreads MUSA image"
            echo ""
            echo "- Train: \`${{ needs.prepare.outputs.release_train_image }}\`"
            echo "- Candidate: \`${{ needs.prepare.outputs.train_image }}\`"
            echo "- Base: \`${{ needs.prepare.outputs.base_image }}\`"
            echo "- FlagScale: \`${{ github.sha }}\`"
            echo "- Megatron-LM-FL: \`${{ env.MUSA_MEGATRON_REF }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: MUSA pipeline summary
    needs: [prepare, validate_pr, build, musa_runtime, musa_cli, musa_unit, musa_train, promote]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify pipeline result
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ needs.validate_pr.result }}" = "success"
            exit 0
          fi

          test "${{ needs.build.result }}" = "success"
          if [ "${{ needs.prepare.outputs.run_tests }}" = "true" ]; then
            test "${{ needs.musa_runtime.result }}" = "success"
            test "${{ needs.musa_cli.result }}" = "success"
            test "${{ needs.musa_unit.result }}" = "success"
            test "${{ needs.musa_train.result }}" = "success"
          fi
          if [ "${{ needs.prepare.outputs.publish }}" = "true" ] && \
             [ "${{ needs.prepare.outputs.run_tests }}" = "true" ]; then
            test "${{ needs.promote.result }}" = "success"
          fi

          {
            echo "### MThreads MUSA image"
            echo ""
            echo "- Image: \`${{ needs.prepare.outputs.train_image }}\`"
            echo "- Target: \`${{ needs.prepare.outputs.target }}\`"
            echo "- Published: \`${{ needs.prepare.outputs.publish }}\`"
            echo "- Promoted: \`${{ needs.promote.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
