# Ascend NPU Hardware Configuration
# This file defines CI/CD settings for Huawei Ascend NPU-based testing
# Test configurations are defined in tests/test_utils/config/platforms/ascend.yaml

hardware_name: ascend
display_name: "Ascend NPU Tests"

# Docker image for this hardware
ci_image: harbor.baai.ac.cn/flagos-dev/flagscale:manual-20260812-ascend-dev-inference@sha256:e5b8e3b2c37584f980dffa1c08649b44e9edd2415522e123502e8d82a7854ef1
ci_train_image: harbor.baai.ac.cn/flagos-dev/flagscale:manual-20260812-ascend-dev-train@sha256:2b6ceb58a1dc345ba89b2f8eb22dcc73aeec2048aa8e141abfaaf80f8635b91c
ci_inference_image: harbor.baai.ac.cn/flagos-dev/flagscale:manual-20260812-ascend-dev-inference@sha256:e5b8e3b2c37584f980dffa1c08649b44e9edd2415522e123502e8d82a7854ef1

# Runner labels for this hardware
runner_labels: ["flagscale-ascend-ascend910-gpu2-32c-128g"]

# Container volumes (hardware-specific paths)
container_volumes:
  - /public-ks3/cicd/baai_datasets:/home/gitlab-runner/data
  - /public-ks3/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers
  - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
  - /usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons:ro
  - /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro

# Image build contract consumed by the generic build workflow.
image_build:
  enabled: true
  registry: harbor.baai.ac.cn
  target: dev
  network: host
  max_parallel: 1
  registry_login: true
  validation_script: tools/install/ascend/validate_image_build.sh
  tasks:
    train:
      dockerfile: docker/ascend/Dockerfile.train
      image: flagos-dev/flagscale-train
      test_roles: [train]
      base_image: harbor.baai.ac.cn/flagos-dev/megatron-lm-fl:manual-20260717-ascend-dev@sha256:1384b5cb596c3e1012c9f9fca64ed9e2960e27addc73b17704b3c1abcaf1fa02
      build_args:
        PKG_MGR: pip
      source_refs:
        FLAGSCALE_TE_REF: transformer_engine_fl
        FLAGSCALE_MEGATRON_REF: megatron_lm_fl
    inference:
      dockerfile: docker/ascend/Dockerfile.inference
      image: flagos-dev/flagscale-inference
      test_roles: [inference]
      base_image: harbor.baai.ac.cn/flagscale/vllm-plugin-fl@sha256:5062ac23b8b8247e5b4faa5d2c61b7b8e82e46a9ae7c55fe15c5cdbe3533f4b7
      build_args: {}
      source_refs:
        VLLM_PLUGIN_FL_REF: vllm_plugin_fl
        FLAGGEMS_REF: flaggems
    all:
      dockerfile: docker/ascend/Dockerfile.all
      image: flagos-dev/flagscale-all
      test_roles: [train, inference]
      base_image: harbor.baai.ac.cn/flagos-dev/flagscale:manual-20260812-ascend-dev-inference@sha256:e5b8e3b2c37584f980dffa1c08649b44e9edd2415522e123502e8d82a7854ef1
      build_args:
        TRAIN_BASE_IMAGE: harbor.baai.ac.cn/flagos-dev/flagscale:manual-20260812-ascend-dev-train@sha256:2b6ceb58a1dc345ba89b2f8eb22dcc73aeec2048aa8e141abfaaf80f8635b91c
        INFERENCE_BASE_IMAGE: harbor.baai.ac.cn/flagos-dev/flagscale:manual-20260812-ascend-dev-inference@sha256:e5b8e3b2c37584f980dffa1c08649b44e9edd2415522e123502e8d82a7854ef1
      test_environments:
        train:
          pkg_mgr: runtime
          env_path: /opt/flagscale/runtimes/train
        inference:
          pkg_mgr: runtime
          env_path: /opt/flagscale/runtimes/inference
        serve:
          pkg_mgr: runtime
          env_path: /opt/flagscale/runtimes/serve

# Container options for Ascend NPU (no --gpus, use --device for NPU cards)
container_options: >-
  --device /dev/davinci_manager
  --device /dev/devmm_svm
  --device /dev/hisi_hdc
  --ipc=host
  --shm-size=500g
  --hostname flagscale_cicd
  --user root
  --ulimit nofile=65535:65535
  --cap-add SYS_ADMIN
  --cap-add SYS_PTRACE
  --cap-add IPC_LOCK
  --cap-add NET_ADMIN
  --cap-add SYS_RAWIO
  --cap-add SYS_NICE
  --security-opt seccomp=unconfined
  --security-opt apparmor=unconfined
  --privileged

# Runtime allowances for the currently validated Ascend images. Keep these
# values in platform configuration so common workflows remain chip-agnostic.
timeouts:
  inference_minutes: 15
  serve_ready_seconds: 600

# =============================================================================
# Package Manager Configuration
# =============================================================================
# Ascend CI image has all dependencies pre-installed; use pip directly.
pkg_mgr: "pip"

# Environment path (not used for pip, kept for compatibility)
env_path: ""

# Conda environment name (not used for pip)
env_names:
  train: ""
  hetero_train: ""
  inference: ""
  serve: ""
  rl: ""
