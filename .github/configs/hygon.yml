hardware_name: hygon
display_name: "Hygon BW1000 Tests"

# Stable BW1000 training image validated by the Hygon functional test.
ci_image: harbor.baai.ac.cn/flagos-dev/flagscale:8b5c7f1-hygon-dev
ci_train_image: harbor.baai.ac.cn/flagos-dev/flagscale:8b5c7f1-hygon-dev

runner_labels: ["flagscale-hygon-bw1000-gpu8"]

# Image build contract consumed by the generic build workflow. Hygon currently
# provides a training image only; inference dependencies are intentionally
# excluded from this image.
image_build:
  enabled: true
  registry: harbor.baai.ac.cn
  target: dev
  network: host
  max_parallel: 1
  registry_login: true
  validation_script: tools/install/hygon/validate_image_build.sh
  runtime_smoke_nproc: 2
  runtime_device_count: 2
  tasks:
    train:
      dockerfile: docker/hygon/Dockerfile.train
      image: flagos-dev/flagscale-train
      test_roles: [train]
      # The vendor-provided DTK base retains its historical vllm repository
      # name, but this training image does not install vLLM-plugin-FL.
      base_image: harbor.sourcefind.cn:5443/dcu/admin/base/vllm:0.15.1-ubuntu22.04-dtk26.04-py3.10
      build_args: {}
      source_refs:
        MEGATRON_REF: megatron_lm_fl
        FLAGGEMS_REF: flaggems
        TRANSFORMER_ENGINE_REF: transformer_engine_fl
      test_environments:
        train:
          pkg_mgr: pip
          env_name: ""
          env_path: /usr/local

container_volumes:
  - /opt/hyhal:/opt/hyhal:ro
  - /public-flash/lihongyang/data:/home/gitlab-runner/data:ro
  - /public-flash/lihongyang/qwentokenizer:/home/gitlab-runner/tokenizers/qwentokenizer:ro

# DTK exposes BW1000 devices through the KFD/DRI compatibility interfaces.
# Force Git checkout to HTTP/1.1 because this runner network intermittently
# resets GitHub HTTP/2 transfers.
container_options: >-
  --device=/dev/kfd
  --device=/dev/dri
  --group-add video
  --ipc=host
  --env HSA_FORCE_FINE_GRAIN_PCIE=1
  --env GIT_CONFIG_COUNT=1
  --env GIT_CONFIG_KEY_0=http.version
  --env GIT_CONFIG_VALUE_0=HTTP/1.1
  --shm-size=64g
  --user root
  --ulimit nofile=1048576:1048576
  --cap-add SYS_PTRACE
  --security-opt seccomp=unconfined

pkg_mgr: "pip"
env_path: "/usr/local"
env_names:
  train: ""
  hetero_train: ""
  inference: ""
  serve: ""
  rl: ""
