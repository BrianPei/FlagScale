hardware_name: ppu
display_name: "T-Head PPU training"
runner_labels: [flagcicd-810e]
# Intentionally unpublished: fill only after PPU acceptance and digest verification.
# Use ppu_train.yml to inspect/build/test candidates before promotion.
ci_train_image: ""
pkg_mgr: pip
env_path: ""
env_names:
  train: ""

image_build:
  enabled: true
  registry: harbor.baai.ac.cn
  target: dev
  network: default
  max_parallel: 1
  runtime_device_count: '16'
  runtime_smoke_nproc: '2'
  registry_login: false
  runner_labels: [flagcicd-810e]
  validation_script: tools/install/ppu/validate_image_build.sh
  tasks:
    train:
      dockerfile: docker/ppu/Dockerfile.train
      image: flagos-dev/flagscale-train
      base_image: harbor.baai.ac.cn/flagos-dev/flagcx:manual-20260827-ppu-dev
      test_roles: [train]
      source_refs:
        FLAGSCALE_MEGATRON_REF: megatron_lm_fl
        FLAGSCALE_TE_REF: transformer_engine_fl

# Provision these host directories before running acceptance.
# Their contents are not inferred from the FlagCX base image.
container_volumes:
  - /mnt/flagscale/data:/home/gitlab-runner/data:ro
  - /mnt/flagscale/tokenizers:/home/gitlab-runner/tokenizers:ro
# Device layout from flagos-ai/FlagCX de5e09d62008c659c6e43d25225fc7ff207f89cd.
# No --network=host here: GitHub container jobs supply their own network.
container_options: >-
  --shm-size=100g
  --ulimit=memlock=-1
  --ulimit=stack=67108864
  --device=/dev/alixpu
  --device=/dev/alixpu_ctl
  --device=/dev/alixpu_ppu0
  --device=/dev/alixpu_ppu1
  --device=/dev/alixpu_ppu2
  --device=/dev/alixpu_ppu3
  --device=/dev/alixpu_ppu4
  --device=/dev/alixpu_ppu5
  --device=/dev/alixpu_ppu6
  --device=/dev/alixpu_ppu7
  --device=/dev/alixpu_ppu8
  --device=/dev/alixpu_ppu9
  --device=/dev/alixpu_ppu10
  --device=/dev/alixpu_ppu11
  --device=/dev/alixpu_ppu12
  --device=/dev/alixpu_ppu13
  --device=/dev/alixpu_ppu14
  --device=/dev/alixpu_ppu15
  --device=/dev/infiniband/rdma_cm
  --device=/dev/infiniband/uverbs0
  --device=/dev/infiniband/uverbs1
  --device=/dev/infiniband/uverbs2
  --device=/dev/infiniband/uverbs3
  --device=/dev/infiniband/fic2_soe_ucmd0
  --device=/dev/infiniband/fic2_soe_ucmd1
  --device=/dev/infiniband/fic2_soe_ucmd2
  --device=/dev/infiniband/fic2_soe_ucmd3
  --env=TE_FL_SKIP_CUDA=1
  --env=TE_FL_PREFER=reference
  --env=NVTE_FLASH_ATTN=0
  --env=NVTE_FUSED_ATTN=0
  --env=FLAGSCALE_TEST_DIST_BACKEND=nccl
