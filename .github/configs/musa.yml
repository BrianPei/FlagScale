# MThreads MUSA S5000 Hardware Configuration
# This file defines CI/CD settings for MUSA-based testing.

hardware_name: musa
display_name: "MThreads MUSA Tests"

# Official S5000 base, pinned to avoid an accidental MUSA/PyTorch upgrade when
# the vendor moves a mutable tag. The build workflow overrides ci_train_image
# with the freshly built candidate before running tests.
ci_image: registry.mthreads.com/mcconline/musa-pytorch-release-public:rc5.1.0-v2.9.1-S5000-py310@sha256:780b113070853ecc181cdcb73613ec44b6428f54bb8b9915647d8c32c27ea9a5
ci_train_image: registry.mthreads.com/mcconline/musa-pytorch-release-public:rc5.1.0-v2.9.1-S5000-py310@sha256:780b113070853ecc181cdcb73613ec44b6428f54bb8b9915647d8c32c27ea9a5
ci_inference_image: registry.mthreads.com/mcconline/musa-pytorch-release-public:rc5.1.0-v2.9.1-S5000-py310@sha256:780b113070853ecc181cdcb73613ec44b6428f54bb8b9915647d8c32c27ea9a5

# Runner labels for MThreads MUSA hardware
runner_labels: ["flagscale-musa-s5000-gpu2-8c-256g"]

# Container volumes (hardware-specific paths)
container_volumes:
  - /mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data
  - /mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers

# Container options for MThreads MUSA runtime
container_options: >-
  --hostname=flagscale-ci
  --privileged
  --network=host
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --env MTHREADS_VISIBLE_DEVICES=all
  --env MTHREADS_DRIVER_CAPABILITIES=all
  --user root
  --ulimit nofile=65535:65535

# =============================================================================
# Package Manager Configuration
# =============================================================================
pkg_mgr: "pip"

# Environment path (conda installation path)
env_path: ""

# Conda environment names
env_names:
  train: ""
  hetero_train: ""
  inference: ""
  rl: ""
