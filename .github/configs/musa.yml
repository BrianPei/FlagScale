# MThreads MUSA S5000 Hardware Configuration
# This file defines CI/CD settings for MUSA-based testing.

hardware_name: musa
display_name: "MThreads MUSA Tests"

# PyTorch 2.7.1/MCCL is pinned to the digest verified with the S5000 fleet's
# 3.3.5-server driver. The build workflow overrides ci_train_image with its
# freshly built candidate. Inference remains disabled in the test matrix.
ci_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:29ceebd-musa-ci@sha256:ef0c9a4d3df15c077ffcc589e66debbb8fd3a53248f384151d896e45a08894d0
ci_train_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:29ceebd-musa-ci@sha256:ef0c9a4d3df15c077ffcc589e66debbb8fd3a53248f384151d896e45a08894d0
ci_inference_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl:29ceebd-musa-ci@sha256:ef0c9a4d3df15c077ffcc589e66debbb8fd3a53248f384151d896e45a08894d0

# Runner labels for MThreads MUSA hardware
runner_labels: ["flagscale-mthreads-s5000-gpu8"]

# Container volumes (hardware-specific paths)
container_volumes:
  - /mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data
  - /mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers

# Container options for MThreads MUSA runtime
container_options: >-
  --hostname=flagscale-ci
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --env MTHREADS_VISIBLE_DEVICES=all
  --env MTHREADS_DRIVER_CAPABILITIES=all
  --user root
  --ulimit nofile=65535:65535

# =============================================================================
# Package Manager Configuration
# =============================================================================
pkg_mgr: "pip"

# Environment path (conda installation path)
env_path: ""

# Conda environment names
env_names:
  train: ""
  hetero_train: ""
  inference: ""
  serve: ""
  rl: ""
