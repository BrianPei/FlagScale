# MetaX C550 Hardware Configuration
# This file defines CI/CD settings for MetaX C550 GPU (MACA) testing
# Test configurations are defined in tests/test_utils/config/platforms/metax.yaml

hardware_name: metax
display_name: "MetaX C550 Tests"

# Docker images for MetaX C550 (MACA-based)
ci_image: harbor.baai.ac.cn/flagscale/megatron-lm-with-te:202603231839
ci_train_image: harbor.baai.ac.cn/flagos-dev/flagscale:0a6cc4b-metax-train-dev@sha256:2a59d6df4fb4f9ddb09feb3b266cb44de06492c599d802d50b0477ca80891573
ci_inference_image: harbor.baai.ac.cn/flagos-dev/flagscale-inference:86c8e54-metax-dev@sha256:8d9a8ac56cb127eb4fee94e2c14da1fe9cd3cd0b0d70d8875ca5edf46b9c4a65

# Runner labels for MetaX C550 hardware
runner_labels: ["flagscale-metax-c550-gpu2-8c-256g"]

# Container volumes (hardware-specific paths)
container_volumes:
  - /mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data
  - /mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers

# Image build contract consumed by the generic build workflow.
image_build:
  enabled: true
  registry: harbor.baai.ac.cn
  target: dev
  network: default
  max_parallel: 1
  # The C550 runner exposes an eight-device host. Individual image smoke
  # tests still use runtime_smoke_nproc=2 below because the smoke collective
  # only needs two processes.
  runtime_device_count: '8'
  runtime_smoke_nproc: '2'
  registry_login: true
  validation_script: tools/install/metax/validate_image_build.sh
  tasks:
    train:
      dockerfile: docker/metax/Dockerfile.train
      image: flagos-dev/flagscale-train
      test_roles: [train]
      base_image: harbor.baai.ac.cn/flagscale/megatron-lm-with-te@sha256:c6bc75f8512a3ba385339a536a33dfc1dcbeb0c42b6ca1e2d5f0f0e4e9d6200f
      build_args: {}
      source_refs:
        FLAGSCALE_MEGATRON_REF: megatron_lm_fl
        FLAGSCALE_TE_REF: transformer_engine_fl
    inference:
      dockerfile: docker/metax/Dockerfile.inference
      image: flagos-dev/flagscale-inference
      test_roles: [inference]
      base_image: harbor.baai.ac.cn/flagos-dev/vllm-plugin-fl@sha256:c83a7b26e5b72fcffa920f32929a76984c78d5ee5520828b6e50feb9864240ed
      source_refs:
        VLLM_PLUGIN_FL_REF: vllm_plugin_fl
    all:
      dockerfile: docker/metax/Dockerfile.all
      image: flagos-dev/flagscale-all
      test_roles: [train, inference]
      base_image: harbor.baai.ac.cn/flagos-dev/flagscale-inference:86c8e54-metax-dev@sha256:8d9a8ac56cb127eb4fee94e2c14da1fe9cd3cd0b0d70d8875ca5edf46b9c4a65
      build_args:
        TRAIN_BASE_IMAGE: harbor.baai.ac.cn/flagos-dev/flagscale:0a6cc4b-metax-train-dev@sha256:2a59d6df4fb4f9ddb09feb3b266cb44de06492c599d802d50b0477ca80891573
        INFERENCE_BASE_IMAGE: harbor.baai.ac.cn/flagos-dev/flagscale-inference:86c8e54-metax-dev@sha256:8d9a8ac56cb127eb4fee94e2c14da1fe9cd3cd0b0d70d8875ca5edf46b9c4a65
      source_refs:
        FLAGSCALE_MEGATRON_REF: megatron_lm_fl
        FLAGSCALE_TE_REF: transformer_engine_fl
        VLLM_PLUGIN_FL_REF: vllm_plugin_fl
      test_environments:
        train:
          pkg_mgr: runtime
          env_path: /opt/flagscale/runtimes/train
        inference:
          pkg_mgr: runtime
          env_path: /opt/flagscale/runtimes/inference
        serve:
          pkg_mgr: runtime
          env_path: /opt/flagscale/runtimes/serve

# Container options for MetaX C550 (MACA runtime)
container_options: >-
  --hostname=flagscale-ci
  --ipc=host
  --group-add video
  --shm-size=100g
  --ulimit memlock=-1
  --security-opt seccomp=unconfined
  --security-opt apparmor=unconfined
  --device=/dev/dri
  --device=/dev/mxcd
  --device=/dev/infiniband
  --user root
  --ulimit nofile=65535:65535
  --cap-add SYS_ADMIN
  --cap-add SYS_PTRACE
  --cap-add IPC_LOCK
  --cap-add NET_ADMIN
  --security-opt seccomp=unconfined

# =============================================================================
# Package Manager Configuration
# =============================================================================
pkg_mgr: "conda"

# Environment path (conda installation path)
env_path: "/opt/conda"

# Conda environment names
env_names:
  train: "base"
  hetero_train: ""
  inference: ""
  serve: ""
  rl: ""
