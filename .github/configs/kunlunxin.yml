# Kunlunxin P800 Hardware Configuration
# This file defines CI/CD settings for Kunlunxin P800 GPU testing.
# Test configurations are defined in tests/test_utils/config/platforms/kunlunxin.yaml.

hardware_name: kunlunxin
display_name: 'Kunlunxin P800 Tests'

# Use validated task-specific P800 images.
ci_image: harbor.baai.ac.cn/flagos-dev/flagscale-all:manual-20260817-kunlunxin-p800-dev
ci_train_image: harbor.baai.ac.cn/flagos-dev/flagscale-train:manual-20260817-kunlunxin-p800-dev
ci_inference_image: harbor.baai.ac.cn/flagos-dev/flagscale-inference:manual-20260817-kunlunxin-p800-dev

# Directory to store image tar files (shared between build and push workflows)
tar_dir: /mnt/airs-business/cicd/image_tar

# Runner labels for Kunlunxin P800 hardware
runner_labels: ['flagscale-kunlun-p800-gpu8']

# Container volumes (hardware-specific paths)
container_volumes:
  - /mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data
  - /mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers

# Container options for Kunlunxin P800 runtime.
container_options: >-
  --hostname=flagscale-ci
  --privileged
  --ipc=host
  --shm-size=64g
  --user root
  --ulimit nofile=65535:65535

# =============================================================================
# Package Manager Configuration
# =============================================================================
pkg_mgr: 'conda'

# Kunlunxin vendor image provides the torch runtime in this conda environment.
env_path: '/root/miniconda'

env_names:
  train: 'python310_torch29_cuda'
  hetero_train: ''
  inference: 'python310_torch29_cuda'
  serve: 'python310_torch29_cuda'
  rl: ''
