defaults:
  - _self_
  - inference: 4b_tp2_kunlunxin

experiment:
  exp_name: qwen3
  exp_dir: tests/functional_tests/inference/qwen3/test_results/4b_tp2_kunlunxin
  task:
    type: inference
    backend: vllm
    entrypoint: flagscale/inference/inference_llm.py
  runner:
    hostfile: null
  cmds:
    before_start:
      source /root/miniconda/etc/profile.d/conda.sh && conda activate python310_torch29_cuda && . /etc/profile.d/flagscale-env.sh
  envs:
    HYDRA_FULL_ERROR: 1
    VLLM_PLUGINS: "fl"
    VLLM_FL_PLATFORM: "kunlunxin"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    # Aligns with the official Kunlunxin P800 inference env (20260812 PDF): no
    # VLLM_FL_PREFER is set, so vllm_fl's use_flaggems() stays True and
    # attention dispatches through the flag_gems triton path
    # (flag_gems._kunlunxin.ops.*), which the PDF shows producing correct
    # output on the official runtime image (Triton 3.0.0 kunlunxin-adapted).
    # 1512ea6 previously set VLLM_FL_PREFER=vendor to dodge a libcuda.so.1
    # assert on the old flagos-dev base image, but 645116a swapped in the
    # official runtime image where triton no longer asserts -- the vendor
    # XFlashAttention decode then became the garbled-output source.
    # USE_RESHAPE_AND_CACHE_FLASH=1 is the official env value.
    USE_RESHAPE_AND_CACHE_FLASH: "1"
    # Log vllm_fl dispatch routing (which backend each op resolves to).
    VLLM_FL_DISPATCH_DEBUG: "1"
    # Skip vllm_fl's unconditional patch_decode_attention (upstream
    # vllm-plugin-FL kunlunxin/patch.py), which replaces
    # KunlunxinPagedAttention.forward_decode with
    # xtorch_ops.prefill_attention(is_prefix_cache=True). That workaround
    # targets a decode NaN observed on layer 43+ of Qwen3.6-27B; Qwen3-4B
    # (36 layers) does not hit it, so forcing prefill_attention here
    # mis-maps the paged KV cache and garbles decode output (CI shows
    # prompt echo correct but decode tokens scrambled). This keeps the
    # native forward_decode to verify. Applied via
    # tools/install/kunlunxin/patch_vllm_fl_kunlunxin.py; remove once
    # upstream gates the fallback on a runtime NaN check.
    VLLM_FL_KLX_DISABLE_DECODE_PATCH: "1"
    # flag_gems library vendor selection (used at import by DeviceDetector /
    # backend init). flag_gems needs the kunlunxin vendor to init correctly
    # (its quick-cmd probe has no kunlunxin entry); op dispatch now runs
    # through flag_gems (no VLLM_FL_PREFER override).
    GEMS_VENDOR: "kunlunxin"
    CUDA_VISIBLE_DEVICES: "0,1"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    CUDNN_BENCHMARK: "false"
    CUDNN_DETERMINISTIC: "true"
    NCCL_ALGO: "Ring"
    NVTE_APPLY_QK_LAYER_SCALING: 0
    NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
    NVTE_FLASH_ATTN: 0
    NVTE_FUSED_ATTN: 0
    SEED: 1234
    PYTHONHASHSEED: 0
    MKL_NUM_THREADS: 1
    OMP_NUM_THREADS: 1
    NUMEXPR_NUM_THREADS: 1
    SCIPY_RDRANDOM: 0
    TF_DETERMINISTIC_OPS: 1
    TORCH_CUDNN_DETERMINISM: true
    CUDA_LAUNCH_BLOCKING: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
