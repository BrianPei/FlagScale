defaults:
  - _self_
  - inference: 4b_tp2_kunlunxin

experiment:
  exp_name: qwen3
  exp_dir: tests/functional_tests/inference/qwen3/test_results/4b_tp2_kunlunxin
  task:
    type: inference
    backend: vllm
    entrypoint: flagscale/inference/inference_llm.py
  runner:
    hostfile: null
  cmds:
    before_start:
      source /root/miniconda/etc/profile.d/conda.sh && conda activate python310_torch29_cuda && . /etc/profile.d/flagscale-env.sh
  envs:
    HYDRA_FULL_ERROR: 1
    VLLM_PLUGINS: "fl"
    VLLM_FL_PLATFORM: "kunlunxin"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    USE_FLAGGEMS: "false"
    CUDA_VISIBLE_DEVICES: "0,1"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    CUDNN_BENCHMARK: "false"
    CUDNN_DETERMINISTIC: "true"
    NCCL_ALGO: "Ring"
    NVTE_APPLY_QK_LAYER_SCALING: 0
    NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
    NVTE_FLASH_ATTN: 0
    NVTE_FUSED_ATTN: 0
    SEED: 1234
    PYTHONHASHSEED: 0
    MKL_NUM_THREADS: 1
    OMP_NUM_THREADS: 1
    NUMEXPR_NUM_THREADS: 1
    SCIPY_RDRANDOM: 0
    TF_DETERMINISTIC_OPS: 1
    TORCH_CUDNN_DETERMINISM: true
    CUDA_LAUNCH_BLOCKING: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
