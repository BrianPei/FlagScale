defaults:
  - _self_
  - train: 0_6b_musa_reference

experiment:
  exp_name: 0_6b_musa_reference
  exp_dir: tests/functional_tests/train/qwen3/test_results/0_6b_musa_reference
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    ssh_port: null
    nnodes: 1
    nproc_per_node: 8
  shell_cmds: null
  envs:
    HYDRA_FULL_ERROR: 1
    FS_PLATFORM: musa
    TE_FL_PREFER: reference
    ACCELERATOR_BACKEND: musa
    MUSA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    MTHREADS_VISIBLE_DEVICES: all
    MTHREADS_DRIVER_CAPABILITIES: all
  cmds:
    before_start: ''

test:
  training_smoke:
    enabled: true
    metric: "lm loss:"
    min_values: 3

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
