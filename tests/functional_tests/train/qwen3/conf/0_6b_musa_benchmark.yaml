defaults:
  - _self_
  - train: 0_6b_musa_benchmark

experiment:
  exp_name: 0_6b_musa_benchmark
  exp_dir: tests/functional_tests/train/qwen3/test_results/0_6b_musa_benchmark
  task:
    type: train
    backend: megatron
    entrypoint: /opt/flagscale/bin/launch_megatron_gpt.py
  runner:
    backend: torchrun
    nnodes: 1
    nproc_per_node: 2
    rdzv_backend: static
    no_shared_fs: false
  shell_cmds: null
  envs:
    HYDRA_FULL_ERROR: 1
    FS_PLATFORM: musa
    TORCH_DEVICE_BACKEND_AUTOLOAD: 0
    TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: 1
    TORCHDYNAMO_DISABLE: 1
    TORCH_COMPILE_DISABLE: 1
    NVTE_TORCH_COMPILE: 0
    NVTE_FLASH_ATTN: 1
    NVTE_FUSED_ATTN: 0
    NVTE_UNFUSED_ATTN: 0
    ACCELERATOR_BACKEND: musa
    TE_FL_PREFER: reference
    MUSA_ENABLE_SQMMA: "1"
    MUSA_VISIBLE_DEVICES: "0,1"
    MTHREADS_VISIBLE_DEVICES: all
    MTHREADS_DRIVER_CAPABILITIES: all
  cmds:
    before_start: ''

test:
  training_smoke:
    enabled: true
    metric: "lm loss:"
    min_values: 3

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
