device_types:
  - bw1000

bw1000:
  name: "bw1000"
  tests:
    functional:
      train:
        qwen3: ["0_6b_hygon"]
      hetero_train: {}
      benchmark: {}
      inference: {}
      serve: {}
    unit:
      # Keep this gate to an existing environment-neutral smoke test. The Hygon
      # image carries a vendor Megatron fork that is incompatible with CUDA unit tests.
      nproc_per_node: 1
      include:
        - tests/unit_tests/test_basic.py
      exclude: []
